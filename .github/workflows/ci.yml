name: CI

# CI covers the harness only. It never contacts a real SLM or LLM: the
# smoke job runs against examples/mock_slm_server.py, which is
# deterministic and needs no weights. Specs that require a real model are
# run locally, by hand. See "CI runs no model" in CLAUDE.md for why, and
# for what to run by hand after changing the runner or PTY handling.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms on purpose. The PTY driver and runner must work on
    # each, and only the Linux job exercises the path where Seatbelt is
    # unavailable and sandbox.Available() has to fail with a useful error.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A current toolchain, NOT go.mod's declared minimum. Go 1.22 links
      # race binaries that current macOS dyld refuses to exec ("missing
      # LC_UUID load command"), which fails at run time even though the
      # build succeeds. The declared floor is still checked, by the
      # minimum-go job below.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The PTY tests spend most of their wall clock waiting on real
      # terminal output, so the timeout is generous relative to the work.
      - name: Test
        run: go test -race -timeout 10m ./...

  smoke:
    # End-to-end through the real binary and a real PTY, against the
    # deterministic mock model — this is what catches wiring that every
    # unit test individually passes but that doesn't hold together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build -o slmtest ./cmd/slmtest

      - name: Validate the example specs
        run: |
          for f in examples/*.md; do
            ./slmtest validate "$f"
          done

      - name: Run the echo test against the mock model
        run: |
          python3 examples/mock_slm_server.py &
          for _ in $(seq 30); do
            curl -sf -o /dev/null -X POST http://localhost:8080/v1/chat/completions -d '{}' && break
            sleep 0.5
          done
          ./slmtest run examples/echo-test.md -endpoint http://localhost:8080/v1 -verbose

      - name: Run the driver-frontmatter test against the mock model
        # Same spec as echo-test.md, but selects the driver via the
        # driver:/tui_* frontmatter fields instead of the deprecated
        # unprefixed shell:/term:/size: keys — proves that path end-to-end.
        run: |
          python3 examples/mock_slm_server.py &
          for _ in $(seq 30); do
            curl -sf -o /dev/null -X POST http://localhost:8080/v1/chat/completions -d '{}' && break
            sleep 0.5
          done
          ./slmtest run examples/driver-frontmatter-test.md -endpoint http://localhost:8080/v1 -verbose

      - name: Report JSON is well-formed and reports a pass
        run: |
          python3 examples/mock_slm_server.py &
          sleep 2
          ./slmtest run examples/echo-test.md -endpoint http://localhost:8080/v1 -json > report.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("report.json"))
          assert r["passed"] is True, r
          assert r["steps"][0]["status"] == "pass", r
          print("report OK")
          PY

  browser-smoke:
    # The browserdriver-tagged build + a real headless Chromium page,
    # analogous to the `smoke` job above but for the "browser" driver.
    # Marked best-effort (continue-on-error): whether GitHub's
    # ubuntu-latest image can install Chromium's runtime deps reliably
    # was never verified against a real Actions run when this job was
    # added, only locally on macOS — see CLAUDE.md's "Driver
    # abstraction" section. If this proves flaky in practice, drop
    # continue-on-error's safety net and investigate, or remove the job
    # rather than let it rot silently green.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install Playwright's Chromium
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Build with the browserdriver tag
        run: go build -tags browserdriver ./...

      # This is the real proof point: internal/browserdriver's own tests
      # drive real headless Chromium against a real local static page
      # (no mock/real SLM needed — examples/browser-test.md needs an
      # actual model to drive its click/navigate actions, which isn't
      # available in CI; see "CI runs no model" above).
      - name: Run internal/browserdriver's tests against real Chromium
        run: go test -tags browserdriver -race -timeout 5m ./internal/browserdriver/...

  minimum-go:
    # Keeps go.mod's declared floor honest: the module claims to support
    # this version, so it must at least build and vet with it. Linux only
    # and no -race, because that combination is what the old toolchain
    # cannot produce a runnable binary for on current macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and vet at the declared minimum Go version
        run: |
          go version
          go build ./...
          go vet ./...

      - name: Test without the race detector
        run: go test -timeout 10m ./...
